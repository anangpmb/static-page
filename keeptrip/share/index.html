<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeepTrip — Share</title>
  <style>
    :root {
      --accent: #6C63FF;
      --accent-light: #EEF0FF;
      --bg: #F7F8FC;
      --surface: #FFFFFF;
      --text: #1A1A2E;
      --text2: #6B7280;
      --divider: #E5E7EB;
      --green: #10B981;
      --green-bg: #ECFDF5;
      --red: #EF4444;
      --red-bg: #FEF2F2;
      --orange: #F59E0B;
      --orange-bg: #FFFBEB;
      --radius: 16px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--divider);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { width: 28px; height: 28px; display: flex; align-items: center; }
    .header-title { font-size: 17px; font-weight: 700; color: var(--text); }
    .header-sub { font-size: 12px; color: var(--text2); }
    .pulse-dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      margin-left: auto;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    /* ── Layout ── */
    .container { max-width: 640px; margin: 0 auto; padding: 20px 16px 80px; }
    /* ── Cards ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .card-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-icon { font-size: 20px; }
    .card-title { font-size: 15px; font-weight: 700; }
    .card-count {
      margin-left: auto;
      font-size: 12px;
      color: var(--text2);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 20px;
    }
    /* ── Settlement rows ── */
    .settlement-row {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--divider);
      gap: 12px;
    }
    .settlement-row:last-child { border-bottom: none; }
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      background: var(--accent-light);
      flex-shrink: 0;
    }
    .settlement-names { flex: 1; }
    .settlement-from { font-size: 14px; font-weight: 600; }
    .settlement-to { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .settlement-amount {
      font-size: 15px; font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }
    .badge {
      font-size: 10px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-paid { background: var(--green-bg); color: var(--green); }
    .badge-unpaid { background: var(--accent-light); color: var(--accent); }
    /* ── Expense rows ── */
    .expense-row {
      padding: 14px 20px;
      border-bottom: 1px solid var(--divider);
    }
    .expense-row:last-child { border-bottom: none; }
    .expense-top {
      display: flex; align-items: center; justify-content: space-between;
    }
    .expense-title { font-size: 14px; font-weight: 600; }
    .expense-amount { font-size: 14px; font-weight: 700; color: var(--text); }
    .expense-meta {
      font-size: 12px; color: var(--text2); margin-top: 4px;
    }
    /* ── Balance rows ── */
    .balance-row {
      display: flex; align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--divider);
      gap: 10px;
    }
    .balance-row:last-child { border-bottom: none; }
    .balance-name { flex: 1; font-size: 14px; font-weight: 500; }
    .balance-amount {
      font-size: 14px; font-weight: 700;
    }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .zero { color: var(--text2); }
    /* ── Jastip item rows ── */
    .item-row {
      padding: 14px 20px;
      border-bottom: 1px solid var(--divider);
      display: flex; align-items: center; gap: 12px;
    }
    .item-row:last-child { border-bottom: none; }
    .item-info { flex: 1; }
    .item-name { font-size: 14px; font-weight: 600; }
    .item-meta { font-size: 12px; color: var(--text2); margin-top: 3px; }
    .item-price { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; }
    /* ── Status badges ── */
    .status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
    .status-requested { background: var(--orange-bg); color: var(--orange); }
    .status-bought { background: var(--accent-light); color: var(--accent); }
    .status-handedOver { background: var(--green-bg); color: var(--green); }
    .status-settled { background: var(--divider); color: var(--text2); }
    /* ── Receivable section ── */
    .receivable-row {
      display: flex; align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--divider);
      gap: 12px;
    }
    .receivable-row:last-child { border-bottom: none; }
    .receivable-info { flex: 1; }
    .receivable-name { font-size: 14px; font-weight: 600; }
    .receivable-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }
    .receivable-amount { font-size: 16px; font-weight: 800; color: var(--accent); }
    /* ── States ── */
    .state-box {
      text-align: center; padding: 60px 20px;
    }
    .state-icon { font-size: 48px; margin-bottom: 16px; }
    .state-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .state-text { font-size: 14px; color: var(--text2); line-height: 1.6; }
    /* ── Footer ── */
    .footer {
      text-align: center;
      font-size: 12px; color: var(--text2);
      margin-top: 32px;
    }
    /* ── Trip header ── */
    .trip-hero {
      background: var(--accent);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      color: white;
    }
    .trip-name { font-size: 20px; font-weight: 800; }
    .trip-meta { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  </style>
</head>
<body>

<script>
const CONFIG = {
  supabaseUrl: '__SUPABASE_URL__',
  supabaseAnonKey: '__SUPABASE_ANON_KEY__',
};
</script>

<div class="header">
  <img class="logo" src="keeptrip.svg" alt="KeepTrip" />
  <div>
    <div class="header-title">KeepTrip</div>
    <div class="header-sub">View-only · auto-refresh every 10s</div>
  </div>
  <div class="pulse-dot" id="dot" title="Auto-refreshing"></div>
</div>

<div class="container" id="app">
  <div class="state-box">
    <div class="state-icon">⏳</div>
    <div class="state-title">Memuat data...</div>
  </div>
</div>

<script>
// ── Helpers ──────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const shareId = params.get('id');

function fmt(amount, currency) {
  if (amount == null || isNaN(amount)) return '—';
  try {
    return new Intl.NumberFormat('id-ID', {
      style: 'currency', currency: currency ?? 'IDR',
      minimumFractionDigits: 0, maximumFractionDigits: 0,
    }).format(amount);
  } catch {
    return `${currency} ${Number(amount).toLocaleString('id-ID')}`;
  }
}

function statusLabel(s) {
  return { requested: 'Belum dibeli', bought: 'Sudah dibeli',
           handedOver: 'Sudah diberikan', settled: 'Lunas' }[s] ?? s;
}
function statusClass(s) {
  return `status status-${s}`;
}

function timeAgo(iso) {
  if (!iso) return '';
  const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (diff < 60) return `${diff}d yang lalu`;
  if (diff < 3600) return `${Math.floor(diff/60)}m yang lalu`;
  if (diff < 86400) return `${Math.floor(diff/3600)}j yang lalu`;
  return new Date(iso).toLocaleDateString('id-ID');
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function fetchSession() {
  const url = `${CONFIG.supabaseUrl}/functions/v1/share-session?id=${shareId}`;
  const res = await fetch(url, {
    headers: { apikey: CONFIG.supabaseAnonKey, 'Content-Type': 'application/json' },
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.error ?? 'Not found');
  return json.session;
}

// ── Renderers ─────────────────────────────────────────────────────────────────
function renderSplitBill(data) {
  const settlements = data.settlements ?? [];
  const expenses = data.expenses ?? [];
  const balances = data.net_balances ?? {};
  const currency = data.currency ?? 'IDR';
  const updatedAt = data.updated_at;

  let html = `
    <div class="trip-hero">
      <div class="trip-name">💰 ${esc(data.trip_name ?? '—')}</div>
      <div class="trip-meta">Split Bill · Diperbarui ${timeAgo(updatedAt)}</div>
    </div>`;

  // Settlements
  if (settlements.length) {
    const unpaid = settlements.filter(s => !s.resolved);
    const paid = settlements.filter(s => s.resolved);
    html += `
      <div class="card">
        <div class="card-header">
          <span class="card-icon">🤝</span>
          <span class="card-title">Settlement</span>
          <span class="card-count">${settlements.length}</span>
        </div>`;
    for (const s of [...unpaid, ...paid]) {
      html += `
        <div class="settlement-row">
          <div class="avatar">👤</div>
          <div class="settlement-names">
            <div class="settlement-from">${esc(s.from)} → ${esc(s.to)}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            <div class="settlement-amount">${fmt(s.amount, s.currency ?? currency)}</div>
            <span class="${s.resolved ? 'badge badge-paid' : 'badge badge-unpaid'}">${s.resolved ? 'Lunas' : 'Belum'}</span>
          </div>
        </div>`;
    }
    html += `</div>`;
  }

  // Net balances
  const balKeys = Object.keys(balances);
  if (balKeys.length) {
    html += `
      <div class="card">
        <div class="card-header">
          <span class="card-icon">⚖️</span>
          <span class="card-title">Saldo Bersih</span>
        </div>`;
    for (const name of balKeys) {
      const val = balances[name];
      const cls = val > 0.5 ? 'positive' : val < -0.5 ? 'negative' : 'zero';
      const sign = val > 0.5 ? '+' : '';
      html += `
        <div class="balance-row">
          <div class="balance-name">${esc(name)}</div>
          <div class="balance-amount ${cls}">${sign}${fmt(val, currency)}</div>
        </div>`;
    }
    html += `</div>`;
  }

  // Expenses
  if (expenses.length) {
    html += `
      <div class="card">
        <div class="card-header">
          <span class="card-icon">🧾</span>
          <span class="card-title">Pengeluaran</span>
          <span class="card-count">${expenses.length}</span>
        </div>`;
    for (const e of expenses) {
      const sharedWith = (e.shared_with ?? []).join(', ');
      html += `
        <div class="expense-row">
          <div class="expense-top">
            <div class="expense-title">${esc(e.title)}</div>
            <div class="expense-amount">${fmt(e.amount, e.currency ?? currency)}</div>
          </div>
          <div class="expense-meta">
            Dibayar ${esc(e.paid_by)} · Split ${e.split_mode ?? 'equal'} · ${esc(sharedWith)}
          </div>
        </div>`;
    }
    html += `</div>`;
  }

  return html;
}

function renderJastip(data) {
  const items = data.items ?? [];
  const receivables = data.receivables ?? [];
  const masterCurrency = data.master_currency ?? 'IDR';
  const updatedAt = data.updated_at;

  let html = `
    <div class="trip-hero">
      <div class="trip-name">🎁 ${esc(data.trip_name ?? '—')}</div>
      <div class="trip-meta">Jastip · Diperbarui ${timeAgo(updatedAt)}</div>
    </div>`;

  // Receivables
  if (receivables.length) {
    const total = receivables.reduce((s, r) => s + (r.owed ?? 0), 0);
    html += `
      <div class="card">
        <div class="card-header">
          <span class="card-icon">💵</span>
          <span class="card-title">Tagihan per Orang</span>
          <span class="card-count">${fmt(total, masterCurrency)}</span>
        </div>`;
    for (const r of receivables) {
      html += `
        <div class="receivable-row">
          <div class="avatar">${esc(r.requester_avatar ?? '🎁')}</div>
          <div class="receivable-info">
            <div class="receivable-name">${esc(r.requester_name)}</div>
            <div class="receivable-sub">${r.item_count ?? 0} item · ${r.to_buy_count ?? 0} belum dibeli · ${r.settled_count ?? 0} lunas</div>
          </div>
          <div class="receivable-amount">${fmt(r.owed, r.currency ?? masterCurrency)}</div>
        </div>`;
    }
    html += `</div>`;
  }

  // Items grouped by requester
  const grouped = {};
  for (const it of items) {
    const key = it.requester_name ?? '?';
    if (!grouped[key]) grouped[key] = { avatar: it.requester_avatar, items: [] };
    grouped[key].items.push(it);
  }

  for (const [name, group] of Object.entries(grouped)) {
    html += `
      <div class="card">
        <div class="card-header">
          <span class="card-icon">${esc(group.avatar ?? '🎁')}</span>
          <span class="card-title">${esc(name)}</span>
          <span class="card-count">${group.items.length} item</span>
        </div>`;
    for (const it of group.items) {
      const price = it.actual_price ?? it.target_price;
      const priceCur = it.actual_currency ?? it.target_currency ?? masterCurrency;
      const qty = it.quantity > 1 ? ` ×${it.quantity}` : '';
      html += `
        <div class="item-row">
          <div class="item-info">
            <div class="item-name">${esc(it.name)}${qty}</div>
            <div class="item-meta">${it.note ? esc(it.note) : '&nbsp;'}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            ${price != null ? `<div class="item-price">${fmt(price * (it.quantity ?? 1) + (it.fee_amount ?? 0), priceCur)}</div>` : '<div class="item-price">—</div>'}
            <span class="${statusClass(it.status)}">${statusLabel(it.status)}</span>
          </div>
        </div>`;
    }
    html += `</div>`;
  }

  return html;
}

function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Main loop ─────────────────────────────────────────────────────────────────
const app = document.getElementById('app');
const dot = document.getElementById('dot');

function showError(msg) {
  app.innerHTML = `
    <div class="state-box">
      <div class="state-icon">😕</div>
      <div class="state-title">Link tidak ditemukan</div>
      <div class="state-text">${esc(msg)}<br><br>Link mungkin sudah kadaluarsa (3 hari) atau ID tidak valid.</div>
    </div>`;
}

function showSetup() {
  app.innerHTML = `
    <div class="state-box">
      <div class="state-icon">⚙️</div>
      <div class="state-title">Configuration required</div>
      <div class="state-text">
        Open the <code>index.html</code> file and fill in <code>CONFIG.supabaseUrl</code> and <code>CONFIG.supabaseAnonKey</code>
        with the values from your Supabase dashboard.
      </div>
    </div>`;
}

let lastUpdatedAt = null;

async function refresh() {
  dot.style.background = '#F59E0B'; // orange = loading
  try {
    const session = await fetchSession();
    const data = session.data ?? {};

    // Only re-render if data changed
    if (session.updated_at !== lastUpdatedAt) {
      lastUpdatedAt = session.updated_at;
      let html = '';
      if (session.type === 'split_bill') html = renderSplitBill(data);
      else if (session.type === 'jastip') html = renderJastip(data);
      else html = `<pre style="padding:20px;overflow:auto">${esc(JSON.stringify(data, null, 2))}</pre>`;
      html += `<div class="footer">KeepTrip · Data diperbarui ${timeAgo(session.updated_at)} · <a href="https://keeptrip.app" style="color:var(--accent)">keeptrip.app</a></div>`;
      app.innerHTML = html;
    }

    dot.style.background = 'var(--green)';
  } catch (err) {
    dot.style.background = 'var(--red)';
    if (!lastUpdatedAt) showError(err.message);
    // If we already have content, just update the dot color (offline tolerance)
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
if (!shareId) {
  app.innerHTML = `
    <div class="state-box">
      <div class="state-icon">🔗</div>
      <div class="state-title">Link not found</div>
      <div class="state-text">Open link generated by KeepTrip.</div>
    </div>`;
} else {
  refresh();
  setInterval(refresh, 10_000);
}
</script>
</body>
</html>
