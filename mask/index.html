<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hand Mask Effects</title>
<style>
  :root{
    --panel: rgba(12,15,13,0.88);
    --line:  rgba(200,255,77,0.13);
    --line-dim: rgba(42,48,44,0.5);
    --ink:  #eef2ee;
    --ink-dim: #8a938c;
    --accent: #c8ff4d;
    --accent-dim: #7fa832;
    --danger: #ff6b57;
    --mono: 'JetBrains Mono','SFMono-Regular',Consolas,monospace;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --r: 4px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; color:var(--ink); font-family:var(--sans); overflow:hidden; }

  /* ── App ──────────────────────────────── */
  .app{ position:relative; width:100vw; height:100dvh; overflow:hidden; }

  /* ── Fullscreen viewport ──────────────── */
  .viewport{ position:absolute; inset:0; background:#000; overflow:hidden; }
  video{ display:none; }
  canvas{ position:absolute; display:block; transform-origin:center center; }

  .overlay-msg{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px;
    text-align:center; padding:32px;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .overlay-msg p{ color:var(--ink-dim); font-size:13px; max-width:340px; line-height:1.65; }
  .overlay-msg .err{ color:var(--danger); }

  .countdown-overlay{
    position:absolute; inset:0; display:none;
    align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:700; color:var(--accent);
    font-size:clamp(64px,22vw,140px);
    text-shadow:0 0 40px rgba(200,255,77,.65);
    background:rgba(0,0,0,0.2);
    pointer-events:none; z-index:5;
  }
  .flash-overlay{
    position:absolute; inset:0; background:#fff; opacity:0;
    pointer-events:none; z-index:6;
    transition:opacity 260ms ease-out;
  }
  .flash-overlay.flash{ opacity:0.9; transition:opacity 20ms ease-in; }

  /* ── Top HUD ──────────────────────────── */
  .hud-top{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
    padding-top:max(12px, env(safe-area-inset-top));
    background:linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 100%);
    pointer-events:none;
  }
  .brand{ display:flex; align-items:center; gap:8px; font-family:var(--mono); }
  .brand .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--ink-dim);
    transition:background .2s, box-shadow .2s;
  }
  .brand .dot.live{
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 50%{ opacity:.45; } }
  @media(prefers-reduced-motion:reduce){ .brand .dot.live{ animation:none; } }
  .brand b{ font-size:13px; font-weight:600; }
  .hud-ver{ color:var(--ink-dim); font-size:11px; }
  .stat{ font-family:var(--mono); font-size:11px; color:var(--ink-dim); display:flex; gap:12px; }
  .stat b{ color:var(--ink); font-weight:600; }

  /* ── Control Panel ────────────────────── */
  .ctrl-panel{
    position:absolute; bottom:0; left:0; right:0; z-index:20;
    background:var(--panel);
    backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    padding-bottom:max(12px, env(safe-area-inset-bottom));
  }

  /* handle */
  .panel-handle{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:10px 16px 6px;
    cursor:pointer; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .handle-bar{
    width:36px; height:4px; border-radius:2px;
    background:rgba(200,255,77,0.25);
    transition:background .2s, width .2s;
  }
  .panel-handle:hover .handle-bar{ background:rgba(200,255,77,0.5); width:48px; }
  .panel-handle:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; border-radius:16px 16px 0 0; }
  .handle-meta{ display:flex; align-items:center; gap:6px; }
  .handle-label{ font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); }
  .handle-chevron{
    color:var(--ink-dim); line-height:1; font-size:8px;
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    display:inline-block;
  }
  .ctrl-panel:not(.collapsed) .handle-chevron{ transform:rotate(180deg); }

  /* Quick row — always visible */
  .panel-quick{ padding:4px 12px 10px; }
  .fx-row-wrap{ display:flex; gap:8px; align-items:center; }
  .fx-row{
    display:flex; gap:5px;
    overflow-x:auto; scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    flex:1; padding-bottom:2px;
  }
  .fx-row::-webkit-scrollbar{ display:none; }

  /* Snap button */
  .snap-btn{
    flex-shrink:0; width:44px; height:44px; border-radius:50%;
    background:var(--accent); border:none;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#0e130a;
    transition:filter .15s, transform .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .snap-btn:hover{ filter:brightness(1.1); }
  .snap-btn:active{ transform:scale(.9); }
  .snap-btn:focus-visible{ outline:2px solid #fff; outline-offset:3px; }

  .flip-btn{
    flex-shrink:0; width:44px; height:44px; border-radius:50%;
    background:rgba(200,255,77,0.1); border:1px solid rgba(200,255,77,0.25);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
    transition:background .15s, transform .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .flip-btn:hover{ background:rgba(200,255,77,0.2); }
  .flip-btn:active{ transform:scale(.9) rotate(180deg); }
  .flip-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .flip-btn.spinning svg{ animation:spin-once .35s ease-out forwards; }
  @keyframes spin-once{ to{ transform:rotate(180deg); } }

  /* Expandable section */
  .panel-more{
    overflow:hidden;
    max-height:300px;
    transition:max-height .32s cubic-bezier(.4,0,.2,1), opacity .25s ease;
    opacity:1;
  }
  .ctrl-panel.collapsed .panel-more{ max-height:0; opacity:0; }
  .panel-more-inner{
    border-top:1px solid var(--line-dim);
    padding:8px 12px 6px;
    display:flex; flex-direction:column; gap:7px;
  }

  .ctrl-row{ display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
  .ctrl-label{
    font-family:var(--mono); font-size:9px; text-transform:uppercase;
    letter-spacing:.1em; color:var(--ink-dim);
    min-width:44px; flex-shrink:0;
  }
  .hint-text{
    font-family:var(--mono); font-size:9px; color:var(--ink-dim);
    margin-left:auto; white-space:nowrap;
  }

  /* ── Buttons ──────────────────────────── */
  button.primary{
    font-family:var(--mono); font-size:13px; letter-spacing:.02em;
    background:var(--accent); color:#0e130a;
    border:none; padding:10px 22px; border-radius:var(--r);
    cursor:pointer; font-weight:600; min-height:44px;
    -webkit-tap-highlight-color:transparent;
  }
  button.primary:hover{ filter:brightness(1.08); }
  button.primary:disabled{ opacity:.5; cursor:default; }
  button.primary:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .fxbtn{
    font-family:var(--mono); font-size:11px;
    background:transparent; color:var(--ink-dim);
    border:1px solid var(--line-dim); border-radius:var(--r);
    padding:7px 11px; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:5px;
    min-height:34px; flex-shrink:0;
    transition:border-color .15s, color .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .fxbtn:hover{ border-color:var(--accent-dim); color:var(--ink); }
  .fxbtn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .fxbtn.active{ background:var(--accent); color:#0e130a; border-color:var(--accent); font-weight:600; }
  .fxbtn.warn{ color:var(--danger); border-color:rgba(255,107,87,0.3); }
  .fxbtn.warn:hover{ border-color:var(--danger); }

  .toggle{
    font-family:var(--mono); font-size:10px;
    background:transparent; color:var(--ink-dim);
    border:1px solid var(--line-dim); border-radius:var(--r);
    padding:6px 9px; cursor:pointer;
    display:inline-flex; align-items:center; gap:5px;
    white-space:nowrap; min-height:32px; flex-shrink:0;
    transition:border-color .15s, color .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .toggle:hover{ color:var(--ink); }
  .toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .toggle.on{ color:var(--ink); border-color:var(--accent-dim); }
  .toggle .swatch{ width:6px; height:6px; border-radius:50%; background:var(--ink-dim); flex-shrink:0; }
  .toggle.on .swatch{ background:var(--accent); }

  /* ── Responsive ───────────────────────── */
  @media(max-width:480px){
    .hud-ver{ display:none; }
    .brand b{ font-size:12px; }
    .stat{ font-size:10px; gap:8px; }
    .panel-quick{ padding:2px 10px 8px; }
    .panel-more-inner{ padding:6px 10px 4px; }
    .fxbtn{ font-size:10px; padding:6px 9px; }
    .toggle{ font-size:9px; padding:5px 7px; }
    .hint-text{ display:none; }
  }
  @media(max-height:500px) and (max-width:900px){
    .hud-top{ padding:5px 12px; }
    .stat{ display:none; }
    .panel-quick{ padding:2px 10px 6px; }
    .handle-label, .handle-chevron{ display:none; }
    .handle-bar{ margin-bottom:2px; }
  }

  ::selection{ background:var(--accent); color:#0e130a; }
</style>
</head>
<body>
<div class="app">

  <!-- Fullscreen camera viewport -->
  <div class="viewport">
    <video id="video" playsinline muted></video>
    <canvas id="canvas" width="960" height="720"></canvas>

    <div class="overlay-msg" id="startOverlay">
      <p id="startText">Deteksi hingga 4 tangan (2 orang) — semua ujung jari membentuk area masking efek video. Tiap orang dapat warna polygon berbeda. Butuh akses kamera.</p>
      <button class="primary" id="startBtn">Aktifkan kamera</button>
    </div>

    <div class="countdown-overlay" id="countdownOverlay"></div>
    <div class="flash-overlay" id="flashOverlay"></div>
  </div>

  <!-- Top HUD overlay -->
  <header class="hud-top">
    <div class="brand">
      <div class="dot" id="liveDot"></div>
      <b>HAND MASK</b>
      <span class="hud-ver">v1 · browser edition</span>
    </div>
    <div class="stat">
      <span>FPS <b id="fpsVal">–</b></span>
      <span>HANDS <b id="handsVal">–</b></span>
      <span>PEOPLE <b id="peopleVal">–</b></span>
      <span>NODES <b id="nodesVal">0</b></span>
    </div>
  </header>

  <!-- Bottom control panel -->
  <div class="ctrl-panel collapsed" id="ctrlPanel">

    <div class="panel-handle" id="panelHandle"
         role="button" tabindex="0"
         aria-expanded="false" aria-controls="panelMore">
      <div class="handle-bar"></div>
      <div class="handle-meta">
        <span class="handle-label">Kontrol</span>
        <span class="handle-chevron">▲</span>
      </div>
    </div>

    <!-- Always visible: fx row + snap -->
    <div class="panel-quick">
      <div class="fx-row-wrap">
        <div class="fx-row" id="fxRow" role="radiogroup" aria-label="Pilih efek">
          <button class="fxbtn active" data-fx="none"     role="radio" aria-checked="true" >None</button>
          <button class="fxbtn"        data-fx="negative" role="radio" aria-checked="false">Negative</button>
          <button class="fxbtn"        data-fx="sepia"    role="radio" aria-checked="false">Sepia</button>
          <button class="fxbtn"        data-fx="blur"     role="radio" aria-checked="false">Blur</button>
          <button class="fxbtn"        data-fx="bokeh"    role="radio" aria-checked="false">Bokeh</button>
          <button class="fxbtn"        data-fx="glitch"   role="radio" aria-checked="false">Glitch</button>
          <button class="fxbtn"        data-fx="mono"     role="radio" aria-checked="false">Mono</button>
          <button class="fxbtn"        data-fx="lowpoly"  role="radio" aria-checked="false">Low Poly</button>
        </div>
        <button class="snap-btn" id="snapBtn" aria-label="Ambil screenshot">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </button>
        <button class="flip-btn" id="flipBtn" aria-label="Ganti kamera depan/belakang">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 7h-9"/>
            <path d="M14 2 9 7l5 5"/>
            <path d="M4 17h9"/>
            <path d="M10 22l5-5-5-5"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Expandable section -->
    <div class="panel-more" id="panelMore" aria-hidden="true">
      <div class="panel-more-inner">

        <div class="ctrl-row">
          <span class="ctrl-label">Efek</span>
          <button class="toggle on" id="toggleZone"  aria-pressed="true" ><span class="swatch"></span>Dalam</button>
          <button class="toggle on" id="toggleShape" aria-pressed="true" ><span class="swatch"></span>Convex</button>
          <button class="toggle on" id="toggleDebug" aria-pressed="true" ><span class="swatch"></span>Landmark</button>
          <button class="toggle"    id="toggleMirror" aria-pressed="false"><span class="swatch"></span>Mirror</button>
          <button class="toggle"    id="toggleFacet"  aria-pressed="false"><span class="swatch"></span>Facet: M</button>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">Manual</span>
          <button class="toggle" id="toggleManual" aria-pressed="false"><span class="swatch"></span>Shape: Off</button>
          <button class="fxbtn" id="undoNodeBtn" aria-label="Undo titik terakhir">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
            </svg>
            Undo
          </button>
          <button class="fxbtn warn" id="clearNodesBtn" aria-label="Hapus semua titik">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            Clear
          </button>
          <span class="hint-text">Pinch = titik · 👌 tahan 3s = shutter</span>
        </div>

      </div>
    </div>

  </div><!-- /ctrl-panel -->

</div><!-- /app -->

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ── DOM refs ──────────────────────────────────────────────────
const video        = document.getElementById('video');
const canvas       = document.getElementById('canvas');
const ctx          = canvas.getContext('2d', { willReadFrequently: true });
const startOverlay = document.getElementById('startOverlay');
const startBtn     = document.getElementById('startBtn');
const startText    = document.getElementById('startText');
const liveDot      = document.getElementById('liveDot');
const fpsVal       = document.getElementById('fpsVal');
const handsVal     = document.getElementById('handsVal');
const peopleVal    = document.getElementById('peopleVal');
const fxRow        = document.getElementById('fxRow');
const toggleZone   = document.getElementById('toggleZone');
const toggleShape  = document.getElementById('toggleShape');
const toggleDebug  = document.getElementById('toggleDebug');
const toggleMirror = document.getElementById('toggleMirror');
const toggleFacet  = document.getElementById('toggleFacet');
const snapBtn      = document.getElementById('snapBtn');
const toggleManual = document.getElementById('toggleManual');
const undoNodeBtn  = document.getElementById('undoNodeBtn');
const clearNodesBtn= document.getElementById('clearNodesBtn');
const nodesVal     = document.getElementById('nodesVal');
const countdownOverlay = document.getElementById('countdownOverlay');
const flashOverlay     = document.getElementById('flashOverlay');
const ctrlPanel    = document.getElementById('ctrlPanel');
const panelHandle  = document.getElementById('panelHandle');
const panelMore    = document.getElementById('panelMore');
const flipBtn      = document.getElementById('flipBtn');

// ── Panel collapse / expand ────────────────────────────────────
let panelOpen = false;
function setPanel(open) {
  panelOpen = open;
  ctrlPanel.classList.toggle('collapsed', !open);
  panelHandle.setAttribute('aria-expanded', String(open));
  panelMore.setAttribute('aria-hidden', String(!open));
}
panelHandle.addEventListener('click', () => setPanel(!panelOpen));
panelHandle.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setPanel(!panelOpen); }
});

// ── State ─────────────────────────────────────────────────────
let state = {
  fx: 'none',
  effectInside: true,
  hullMode: true,
  showDebug: true,
  mirror: false,
  running: false,
  facetCell: 34,
  manualMode: false,
  manualNodes: [],
  facingMode: 'user',
};

// ── Offscreen buffers ─────────────────────────────────────────
const workCanvas = document.createElement('canvas');
const workCtx    = workCanvas.getContext('2d');
const fxCanvas   = document.createElement('canvas');
const fxCtx      = fxCanvas.getContext('2d');

function sizeCanvases(w, h) {
  canvas.width = w;   canvas.height = h;
  workCanvas.width = w; workCanvas.height = h;
  fxCanvas.width = w;   fxCanvas.height = h;
  resizeCanvasDisplay();
}

// Cover-fill: scale canvas CSS so it fills the viewport without distorting coords
function resizeCanvasDisplay() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const cw = canvas.width || 960, ch = canvas.height || 720;
  const scale = Math.max(vw / cw, vh / ch);
  const dw = Math.ceil(cw * scale), dh = Math.ceil(ch * scale);
  canvas.style.width  = dw + 'px';
  canvas.style.height = dh + 'px';
  canvas.style.left   = Math.floor((vw - dw) / 2) + 'px';
  canvas.style.top    = Math.floor((vh - dh) / 2) + 'px';
  applyMirrorTransform();
}
function applyMirrorTransform() {
  canvas.style.transform = state.mirror ? 'scaleX(-1)' : '';
}
window.addEventListener('resize', resizeCanvasDisplay);
resizeCanvasDisplay(); // initial sizing before camera starts

// ── Effects (canvas 2D) ───────────────────────────────────────
function applyBuiltInFilter(cssFilter) {
  fxCtx.save();
  fxCtx.filter = cssFilter;
  fxCtx.drawImage(video, 0, 0, fxCanvas.width, fxCanvas.height);
  fxCtx.restore();
}
function fxNegative(){ applyBuiltInFilter('invert(1)'); }
function fxSepia()   { applyBuiltInFilter('sepia(1) saturate(1.3)'); }
function fxBlur()    { applyBuiltInFilter('blur(9px)'); }
function fxMono()    { applyBuiltInFilter('grayscale(1) contrast(1.05)'); }

function fxBokeh() {
  fxCtx.save();
  fxCtx.filter = 'blur(14px) saturate(1.2) brightness(1.05)';
  fxCtx.drawImage(video, 0, 0, fxCanvas.width, fxCanvas.height);
  fxCtx.restore();
  fxCtx.save();
  fxCtx.filter = 'blur(28px) brightness(1.6) contrast(1.3)';
  fxCtx.globalCompositeOperation = 'screen';
  fxCtx.globalAlpha = 0.55;
  fxCtx.drawImage(video, 0, 0, fxCanvas.width, fxCanvas.height);
  fxCtx.restore();
  fxCtx.globalAlpha = 1;
  fxCtx.globalCompositeOperation = 'source-over';
}

let glitchTick = 0;
function fxGlitch() {
  const w = fxCanvas.width, h = fxCanvas.height;
  fxCtx.clearRect(0, 0, w, h);
  fxCtx.drawImage(video, 0, 0, w, h);
  glitchTick++;
  const shift = Math.max(3, Math.floor(w / 90));
  fxCtx.save();
  fxCtx.globalCompositeOperation = 'lighter';
  fxCtx.globalAlpha = 0.55;
  fxCtx.drawImage(video, shift, 0, w, h);
  fxCtx.globalAlpha = 0.35;
  fxCtx.drawImage(video, -shift, 0, w, h);
  fxCtx.restore();
  fxCtx.globalAlpha = 1;
  for (let i = 0; i < 5; i++) {
    const sh = Math.max(2, Math.floor(h / 28));
    const sy = Math.floor(Math.random() * (h - sh));
    const dx = Math.floor((Math.random() - 0.5) * 40);
    const imgData = fxCtx.getImageData(0, sy, w, sh);
    fxCtx.putImageData(imgData, dx, sy);
  }
  if (glitchTick % 5 === 0) {
    fxCtx.fillStyle = `rgba(200,255,77,${0.03 + Math.random() * 0.04})`;
    fxCtx.fillRect(0, 0, w, h);
  }
}

// ── Low Poly ──────────────────────────────────────────────────
let lowPolyMeshCache = null;

function buildLowPolyMesh(w, h, cell) {
  const cols = Math.ceil(w / cell) + 1;
  const rows = Math.ceil(h / cell) + 1;
  const jitter = cell * 0.42;
  const grid = [];
  for (let r = 0; r < rows; r++) {
    grid[r] = [];
    for (let c = 0; c < cols; c++) {
      let x = c * cell, y = r * cell;
      if (r > 0 && r < rows - 1) y += (Math.random() - 0.5) * jitter;
      if (c > 0 && c < cols - 1) x += (Math.random() - 0.5) * jitter;
      grid[r][c] = [Math.min(w, Math.max(0, x)), Math.min(h, Math.max(0, y))];
    }
  }
  const points = [];
  const idx = (r, c) => r * cols + c;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) points.push(grid[r][c]);
  const triangles = [];
  for (let r = 0; r < rows - 1; r++) {
    for (let c = 0; c < cols - 1; c++) {
      const p00 = idx(r,c), p10 = idx(r+1,c), p01 = idx(r,c+1), p11 = idx(r+1,c+1);
      if (Math.random() < 0.5) {
        triangles.push([p00,p10,p01]); triangles.push([p10,p11,p01]);
      } else {
        triangles.push([p00,p10,p11]); triangles.push([p00,p11,p01]);
      }
    }
  }
  return { w, h, cell, points, triangles };
}

function getLowPolyMesh(w, h) {
  if (lowPolyMeshCache && lowPolyMeshCache.w === w && lowPolyMeshCache.h === h && lowPolyMeshCache.cell === state.facetCell)
    return lowPolyMeshCache;
  lowPolyMeshCache = buildLowPolyMesh(w, h, state.facetCell);
  return lowPolyMeshCache;
}

function fxLowPoly() {
  const w = fxCanvas.width, h = fxCanvas.height;
  const mesh = getLowPolyMesh(w, h);
  const src = workCtx.getImageData(0, 0, w, h).data;
  fxCtx.clearRect(0, 0, w, h);
  fxCtx.lineJoin = 'round';
  for (const tri of mesh.triangles) {
    const pa = mesh.points[tri[0]], pb = mesh.points[tri[1]], pc = mesh.points[tri[2]];
    const cx = Math.min(w-1, Math.max(0, Math.round((pa[0]+pb[0]+pc[0])/3)));
    const cy = Math.min(h-1, Math.max(0, Math.round((pa[1]+pb[1]+pc[1])/3)));
    const p = (cy * w + cx) * 4;
    const fill = `rgb(${src[p]},${src[p+1]},${src[p+2]})`;
    fxCtx.beginPath();
    fxCtx.moveTo(pa[0],pa[1]); fxCtx.lineTo(pb[0],pb[1]); fxCtx.lineTo(pc[0],pc[1]);
    fxCtx.closePath();
    fxCtx.fillStyle = fill; fxCtx.fill();
    fxCtx.strokeStyle = fill; fxCtx.lineWidth = 1; fxCtx.stroke();
  }
}

const EFFECTS = {
  none: null, negative: fxNegative, sepia: fxSepia,
  blur: fxBlur, bokeh: fxBokeh, glitch: fxGlitch,
  mono: fxMono, lowpoly: fxLowPoly,
};

// ── Hand Landmarker ───────────────────────────────────────────
let handLandmarker = null;
let lastVideoTime  = -1;

async function initLandmarker() {
  startText.textContent = 'Memuat model deteksi tangan…';
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 4,
    minHandDetectionConfidence: 0.55,
    minHandPresenceConfidence: 0.55,
    minTrackingConfidence: 0.55,
  });
}

async function startCamera() {
  startBtn.disabled = true;
  try { await initLandmarker(); } catch {
    startText.innerHTML = `<span class="err">Gagal memuat model deteksi tangan.</span><br>Cek koneksi internet (butuh cdn.jsdelivr.net &amp; storage.googleapis.com). Kalau ini dibuka di preview artifact, unduh file HTML-nya dan buka langsung di browser.`;
    startBtn.disabled = false; return;
  }
  startText.textContent = 'Meminta izin kamera…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: state.facingMode },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
  } catch {
    startText.innerHTML = `<span class="err">Kamera tidak dapat diakses.</span><br>Pastikan izin kamera diberikan ke halaman ini.`;
    startBtn.disabled = false; return;
  }
  sizeCanvases(video.videoWidth || 960, video.videoHeight || 720);
  startOverlay.style.display = 'none';
  liveDot.classList.add('live');
  state.running = true;
  requestAnimationFrame(loop);
}
startBtn.addEventListener('click', startCamera);

async function switchCamera() {
  if (!state.running) return;
  flipBtn.disabled = true;
  flipBtn.classList.add('spinning');
  setTimeout(() => flipBtn.classList.remove('spinning'), 380);

  video.srcObject?.getTracks().forEach(t => t.stop());
  video.srcObject = null;

  state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
  flipBtn.setAttribute('aria-label', state.facingMode === 'user' ? 'Ganti ke kamera belakang' : 'Ganti ke kamera depan');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: state.facingMode },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    sizeCanvases(video.videoWidth || 960, video.videoHeight || 720);
  } catch {
    // fallback: try without facingMode constraint
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = stream;
      await video.play();
      sizeCanvases(video.videoWidth || 960, video.videoHeight || 720);
    } catch { /* camera unavailable */ }
  }
  flipBtn.disabled = false;
}
flipBtn.addEventListener('click', switchCamera);

// ── Geometry helpers ──────────────────────────────────────────
function convexHull(points) {
  const pts = points.slice().sort((a,b) => a[0]-b[0] || a[1]-b[1]);
  const cross = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lower = [];
  for (const p of pts) {
    while (lower.length>=2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i=pts.length-1; i>=0; i--) {
    const p = pts[i];
    while (upper.length>=2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

function tracePolygon(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i=1; i<pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}

// Draw a hold-progress ring at the OK gesture midpoint
function drawOKProgress(midpoint, progress) {
  const [x, y] = midpoint;
  const r = 24;
  ctx.save();
  // Background track
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(200,255,77,0.22)';
  ctx.lineWidth = 3.5;
  ctx.stroke();
  // Filled arc proportional to hold progress
  if (progress > 0) {
    ctx.beginPath();
    ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
    ctx.strokeStyle = progress >= 1 ? '#ffffff' : '#c8ff4d';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  ctx.restore();
}

// ── Multi-person hand pairing ─────────────────────────────────
// Per-person accent colors: green, cyan, orange, pink
const PERSON_COLORS = ['#c8ff4d', '#4dc8ff', '#ff9f4d', '#ff6b9d'];

// Greedily pair Left+Right hands by wrist proximity.
// Returns array of pairs: each entry is [leftHand?, rightHand?]
function pairHands(hands) {
  const lefts  = hands.filter(h => h.handedness === 'Left');
  const rights = hands.filter(h => h.handedness === 'Right');
  const people  = [];
  const usedRight = new Set();

  for (const left of lefts) {
    let bestDist = Infinity, bestRight = null;
    for (const right of rights) {
      if (usedRight.has(right)) continue;
      const d = Math.hypot(left.wrist[0] - right.wrist[0], left.wrist[1] - right.wrist[1]);
      if (d < bestDist) { bestDist = d; bestRight = right; }
    }
    // Only pair if wrists are within 85% of frame width of each other
    if (bestRight && bestDist < canvas.width * 0.85) {
      usedRight.add(bestRight);
      people.push([left, bestRight]);
    } else {
      people.push([left]);
    }
  }
  for (const right of rights) {
    if (!usedRight.has(right)) people.push([right]);
  }
  return people;
}

// ── Gesture detection ─────────────────────────────────────────
// Index-based state for up to 4 detected hands
const gestureState = Array.from({ length: 4 }, () => ({ pinch: false, ok: false, lastNodeAt: 0, okStartAt: 0 }));
const NODE_PINCH_COOLDOWN = 2000;
const OK_HOLD_MS = 3000;

function dist(a, b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); }

function classifyHand(P) {
  const wrist = P[0];
  const handScale = dist(wrist, P[9]) || 1;
  const pinchDist = dist(P[4], P[8]);
  const isPinching = pinchDist < handScale * 0.42;
  const isExtended = (tip, pip) => dist(wrist, P[tip]) > dist(wrist, P[pip]) * 1.08;
  const isOK = isPinching && isExtended(12,10) && isExtended(16,14) && isExtended(20,18);
  return { isNodePinch: isPinching && !isOK, isOK, midpoint: [(P[4][0]+P[8][0])/2, (P[4][1]+P[8][1])/2] };
}

function addManualNode(pt) {
  if (state.manualNodes.length >= 24) return;
  state.manualNodes.push(pt);
  nodesVal.textContent = state.manualNodes.length;
}

// ── Shutter ───────────────────────────────────────────────────
let shutterActive = false;
const SHUTTER_SECONDS = 5;

function doCapture() {
  const link = document.createElement('a');
  link.download = `hand-mask-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  flashOverlay.classList.add('flash');
  setTimeout(() => flashOverlay.classList.remove('flash'), 150);
}

function triggerShutter() {
  if (shutterActive) return;
  shutterActive = true;
  let remaining = SHUTTER_SECONDS;
  countdownOverlay.style.display = 'flex';
  countdownOverlay.textContent = remaining;
  const t = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(t);
      countdownOverlay.textContent = '📸';
      doCapture();
      setTimeout(() => { countdownOverlay.style.display = 'none'; shutterActive = false; }, 550);
    } else {
      countdownOverlay.textContent = remaining;
    }
  }, 1000);
}

// ── Main loop ─────────────────────────────────────────────────
let fpsHistory = [];
let prevT = performance.now();

function loop() {
  if (!state.running) return;
  if (video.currentTime !== lastVideoTime && handLandmarker) {
    lastVideoTime = video.currentTime;
    const w = canvas.width, h = canvas.height;
    const result = handLandmarker.detectForVideo(video, performance.now());

    ctx.clearRect(0,0,w,h);
    workCtx.clearRect(0,0,w,h);
    workCtx.drawImage(video, 0, 0, w, h);
    ctx.drawImage(workCanvas, 0, 0);

    // ── Collect all detected hands ────────────────────────────
    const allHands = [];
    let handCount = 0;

    if (result.landmarks?.length) {
      handCount = result.landmarks.length;
      result.landmarks.forEach((lm, i) => {
        const handedness = result.handedness[i]?.[0]?.categoryName || `H${i}`;
        const wrist      = [lm[0].x * w, lm[0].y * h];
        // Thumb tip (4) + pointer/index tip (8)
        const fingertips = [4, 8].map(fi => [lm[fi].x * w, lm[fi].y * h]);
        allHands.push({ handedness, wrist, fingertips, lm });

        // Gesture detection for manual mode (up to 4 hands)
        const gs = gestureState[i];
        if (gs) {
          const P = lm.map(p => [p.x * w, p.y * h]);
          const g = classifyHand(P);
          if (g.isNodePinch && !gs.pinch && state.manualMode) {
            const now = performance.now();
            if (now - gs.lastNodeAt >= NODE_PINCH_COOLDOWN) {
              addManualNode(g.midpoint);
              gs.lastNodeAt = now;
            }
          }
          gs.pinch = g.isNodePinch;

          // OK gesture: must hold for OK_HOLD_MS before firing shutter
          if (g.isOK) {
            if (!gs.ok) gs.okStartAt = performance.now(); // start hold timer on first frame
            const held = performance.now() - gs.okStartAt;
            const progress = Math.min(held / OK_HOLD_MS, 1);
            drawOKProgress(g.midpoint, progress);
            if (progress >= 1 && !shutterActive) {
              triggerShutter();
              gs.okStartAt = performance.now(); // reset so next hold starts fresh
            }
          } else {
            gs.okStartAt = 0; // released early — reset
          }
          gs.ok = g.isOK;
        }

        if (state.showDebug) {
          ctx.fillStyle = 'rgba(200,255,77,0.75)';
          lm.forEach(p => {
            ctx.beginPath(); ctx.arc(p.x*w, p.y*h, 2.2, 0, Math.PI*2); ctx.fill();
          });
        }
      });
    }
    handsVal.textContent = handCount;

    // ── Shape + Effect rendering ──────────────────────────────
    if (!state.manualMode) {
      // Multi-person: pair hands and render one shape per person
      const people = pairHands(allHands);
      peopleVal.textContent = people.length || '–';

      people.forEach((pair, pi) => {
        const color = PERSON_COLORS[pi % PERSON_COLORS.length];
        // All fingertips from both hands in this pair (up to 10 points)
        const pts = pair.flatMap(h => h.fingertips);
        if (pts.length < 3) return;
        const poly = state.hullMode ? convexHull(pts) : pts;
        if (poly.length < 3) return;

        const effectFn = EFFECTS[state.fx];
        if (effectFn) {
          effectFn();
          ctx.save();
          if (state.effectInside) {
            tracePolygon(poly); ctx.clip(); ctx.drawImage(fxCanvas, 0, 0);
          } else {
            ctx.drawImage(fxCanvas, 0, 0);
            tracePolygon(poly);
            ctx.save(); ctx.clip(); ctx.drawImage(workCanvas, 0, 0); ctx.restore();
          }
          ctx.restore();
        }

        if (state.showDebug) {
          ctx.save();
          ctx.strokeStyle = color; ctx.lineWidth = 2;
          tracePolygon(poly); ctx.stroke();
          ctx.restore();
          pair.forEach(h => {
            h.fingertips.forEach(p => {
              ctx.fillStyle = color;
              ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, Math.PI * 2); ctx.fill();
            });
          });
        }
      });

    } else {
      // Manual shape mode
      peopleVal.textContent = '–';
      if (state.manualNodes.length >= 3) {
        const polygon  = state.manualNodes;
        const effectFn = EFFECTS[state.fx];
        if (effectFn) {
          effectFn();
          ctx.save();
          if (state.effectInside) {
            tracePolygon(polygon); ctx.clip(); ctx.drawImage(fxCanvas, 0, 0);
          } else {
            ctx.drawImage(fxCanvas, 0, 0);
            tracePolygon(polygon);
            ctx.save(); ctx.clip(); ctx.drawImage(workCanvas, 0, 0); ctx.restore();
          }
          ctx.restore();
        }
      }

      if (state.manualNodes.length > 0) {
        ctx.save();
        ctx.strokeStyle = '#c8ff4d'; ctx.lineWidth = 2;
        ctx.setLineDash(state.manualNodes.length < 3 ? [6,5] : []);
        ctx.beginPath();
        ctx.moveTo(state.manualNodes[0][0], state.manualNodes[0][1]);
        for (let i=1; i<state.manualNodes.length; i++)
          ctx.lineTo(state.manualNodes[i][0], state.manualNodes[i][1]);
        if (state.manualNodes.length >= 3) ctx.closePath();
        ctx.stroke(); ctx.setLineDash([]);
        state.manualNodes.forEach((p, i) => {
          ctx.fillStyle = i === state.manualNodes.length-1 ? '#ffffff' : '#c8ff4d';
          ctx.beginPath(); ctx.arc(p[0],p[1], 6, 0, Math.PI*2); ctx.fill();
        });
        ctx.restore();
      }
    }

    const now = performance.now();
    fpsHistory.push(1000 / (now - prevT));
    prevT = now;
    if (fpsHistory.length > 20) fpsHistory.shift();
    fpsVal.textContent = (fpsHistory.reduce((a,b)=>a+b,0) / fpsHistory.length).toFixed(0);
  }
  requestAnimationFrame(loop);
}

// ── UI wiring ─────────────────────────────────────────────────
fxRow.addEventListener('click', e => {
  const btn = e.target.closest('.fxbtn[data-fx]');
  if (!btn) return;
  state.fx = btn.dataset.fx;
  [...fxRow.querySelectorAll('.fxbtn')].forEach(b => {
    b.classList.toggle('active', b === btn);
    b.setAttribute('aria-checked', String(b === btn));
  });
});

toggleZone.addEventListener('click', () => {
  state.effectInside = !state.effectInside;
  toggleZone.classList.toggle('on', state.effectInside);
  toggleZone.setAttribute('aria-pressed', String(state.effectInside));
  toggleZone.innerHTML = `<span class="swatch"></span>${state.effectInside ? 'Dalam' : 'Luar'}`;
});

toggleShape.addEventListener('click', () => {
  state.hullMode = !state.hullMode;
  toggleShape.classList.toggle('on', state.hullMode);
  toggleShape.setAttribute('aria-pressed', String(state.hullMode));
  toggleShape.innerHTML = `<span class="swatch"></span>${state.hullMode ? 'Convex' : 'Quad'}`;
});

toggleDebug.addEventListener('click', () => {
  state.showDebug = !state.showDebug;
  toggleDebug.classList.toggle('on', state.showDebug);
  toggleDebug.setAttribute('aria-pressed', String(state.showDebug));
});

toggleMirror.addEventListener('click', () => {
  state.mirror = !state.mirror;
  toggleMirror.classList.toggle('on', state.mirror);
  toggleMirror.setAttribute('aria-pressed', String(state.mirror));
  applyMirrorTransform();
});

const FACET_SIZES = [{ label:'S', cell:18 }, { label:'M', cell:34 }, { label:'L', cell:55 }];
let facetIdx = 1;
toggleFacet.addEventListener('click', () => {
  facetIdx = (facetIdx + 1) % FACET_SIZES.length;
  state.facetCell = FACET_SIZES[facetIdx].cell;
  toggleFacet.innerHTML = `<span class="swatch"></span>Facet: ${FACET_SIZES[facetIdx].label}`;
  const on = facetIdx !== 1;
  toggleFacet.classList.toggle('on', on);
  toggleFacet.setAttribute('aria-pressed', String(on));
  lowPolyMeshCache = null;
});

snapBtn.addEventListener('click', doCapture);

toggleManual.addEventListener('click', () => {
  state.manualMode = !state.manualMode;
  toggleManual.classList.toggle('on', state.manualMode);
  toggleManual.setAttribute('aria-pressed', String(state.manualMode));
  toggleManual.innerHTML = `<span class="swatch"></span>Shape: ${state.manualMode ? 'On' : 'Off'}`;
});

undoNodeBtn.addEventListener('click', () => {
  state.manualNodes.pop();
  nodesVal.textContent = state.manualNodes.length;
});

clearNodesBtn.addEventListener('click', () => {
  state.manualNodes.length = 0;
  nodesVal.textContent = 0;
});

// ── Keyboard shortcuts ────────────────────────────────────────
window.addEventListener('keydown', e => {
  const map = {'0':'none','1':'negative','2':'sepia','3':'blur','4':'bokeh','5':'glitch','6':'mono','7':'lowpoly'};
  if (map[e.key]) {
    state.fx = map[e.key];
    [...fxRow.querySelectorAll('.fxbtn')].forEach(b => {
      b.classList.toggle('active', b.dataset.fx === state.fx);
      b.setAttribute('aria-checked', String(b.dataset.fx === state.fx));
    });
  }
  else if (e.key === 'm') toggleZone.click();
  else if (e.key === 'f') toggleShape.click();
  else if (e.key === 'o') toggleDebug.click();
  else if (e.key === 's') snapBtn.click();
  else if (e.key === 'p') toggleManual.click();
  else if (e.key === 'z') undoNodeBtn.click();
  else if (e.key === 'c') clearNodesBtn.click();
  else if (e.key === 'e') setPanel(!panelOpen);
});
</script>
